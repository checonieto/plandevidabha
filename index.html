const S=[
{id:'s1',b:1,t:'Mi horizonte de vida',o:'Comprender la función de un horizonte temporal y calcular una estimación de los años que se podrían planificar.',
c:[['Bicente y el mapa del tiempo',`<p>¡Hola, explorador! Antes de iniciar una aventura conviene tener una idea de cuánto camino podrías recorrer.</p><p>No podemos saber exactamente qué ocurrirá ni cuánto durará cada etapa, pero pensar en un horizonte temporal nos ayuda a imaginar posibilidades y establecer metas realistas. Si quieres comprar una casa, aprender una profesión o completar un proyecto, pensar en los próximos años te ayuda a organizar tus decisiones.</p><p class=tip>Un horizonte temporal es una referencia para planificar, no una predicción de tu futuro.</p>`],
['Calcula tu horizonte',`<p class=big>Años restantes ≈ esperanza de vida estimada − edad actual</p><p>Ejemplo del manual: edad 35, esperanza de vida 80 → 80 − 35 = <b>45 años</b>.</p><p class=tip>El 80 es solo el ejemplo del manual, no una estimación universal ni una garantía. Con datos reales, consulta una fuente estadística adecuada para tu lugar y población.</p>`]],
a:{k:'calc',d:'Practica el cálculo con tus datos. Es privada.'},

a:{k:'sel',d:'Clasifica cada meta en su categoría.',o:AR.map(a=>a[0]),i:[['Ahorrar para un fondo de emergencia',2],['Aprender a tocar un instrumento',1],['Correr una media maratón el próximo año',3],['Obtener un ascenso en dos años',0],['Practicar meditación diariamente',4]]}},
{id:'s3',b:1,t:'Mi mapa de sueños',o:'Construir una primera tabla de metas personales con las categorías del manual.',

a:{k:'form',d:'Tu primera tabla de metas. Las respuestas son privadas y pueden ser generales.'}},

h.querySelector('.b').onclick=function(){if(Q.some(x=>x.a<0))return toast('Responde todas las preguntas');let s=0;
h.querySelectorAll('.qq').forEach((d,i)=>{const x=Q[i],r=x.o[x.a][1];s+=r;d.classList.add(r?'ok':'bad');d.querySelectorAll('.op').forEach((l,j)=>{{const c=x.o[j][1]?'ok':j==x.a?'bad':'';if(c)l.classList.add(c)}l.firstElementChild.disabled=true})});
const p=s>=Math.ceil(Q.length*thr),r=h.querySelector('.res');r.textContent=`${s}/${Q.length} · ${p?'¡Aprobado!':'Repasa las respuestas marcadas e inténtalo de nuevo.'}`;
if(p){this.remove();ok()}else{this.textContent='Reintentar';this.onclick=()=>quiz(h,qs,thr,ok)}}}
function sel(h,a,ok){h.innerHTML=a.i.map(([t],i)=>`<div class=qq><p><b>${i+1}.</b> ${t}</p><select><option value=-1>Elige…</option>${a.o.map((o,j)=>`<option value=${j}>${o}</option>`).join('')}</select><small class=fb></small></div>`).join('')+`<div class=row><span class=res></span><button class=b>Comprobar</button></div>`;
h.querySelector('.b').onclick=()=>{let s=0;h.querySelectorAll('.qq').forEach((d,i)=>{const r=+d.querySelector('select').value==a.i[i][1];s+=r;d.className='qq '+(r?'ok':'bad');d.querySelector('.fb').textContent=r?'✓ Correcto':'Respuesta correcta: '+a.o[a.i[i][1]]});
const p=s>=Math.ceil(a.i.length*.8);h.querySelector('.res').textContent=`${s}/${a.i.length} · ${p?'¡Muy bien!':'Corrige y vuelve a comprobar.'}`;if(p)ok()}}
function calc(h,ok){h.innerHTML=`<div class=cols><label class=fl>Mi edad actual<input type=number id=ca min=0 max=120></label><label class=fl>Esperanza de vida estimada (años)<input type=number id=cb min=1 max=130></label></div><p class=big id=cr>—</p><p class=muted>Úsalo como ejercicio de planificación, no como predicción de cuánto vivirás. Los datos no se guardan.</p><div class=row><span></span><button class=b id=cg>Registrar mi cálculo</button></div>`;
const u=()=>{const a=+$('#ca').value,b=+$('#cb').value,v=$('#ca').value!==''&&b>a;$('#cr').textContent=v?`Resultado aproximado: ${b-a} años`:'—';return v};h.oninput=u;$('#cg').onclick=()=>u()?ok():toast('Revisa los datos')}
function form(h,id,F){h.innerHTML=F.map((f,i)=>`<label class=fl>${f}<textarea rows=2 data-k="${id}.${i}">${esc(st.ans[id+'.'+i]||'')}</textarea></label>`).join('')+`<button class="b ghost" data-c>📋 Copiar mis respuestas</button>`;
h.oninput=e=>{if(e.target.dataset.k){st.ans[e.target.dataset.k]=e.target.value;save()}};h.querySelector('[data-c]').onclick=()=>copy(F.map((f,i)=>f+':\n'+(st.ans[id+'.'+i]||'')).join('\n\n'))}
const filled=id=>FM[id].some((_,i)=>(st.ans[id+'.'+i]||'').trim());
function act(s){const a=s.a,k=s.id+'a',h=$('#host'),ok=()=>fin(k,25);
if(a.k=='q')quiz(h,a.q,.6,ok);else if(a.k=='sel')sel(h,a,ok);else if(a.k=='calc')calc(h,ok);
else{form(h,s.id,FM[s.id]);h.insertAdjacentHTML('beforeend',`<div class=row><span class=muted>Respuestas privadas, guardadas en tu navegador.</span><button class=b id=sv>Guardar y continuar</button></div>`);$('#sv').onclick=()=>filled(s.id)?ok():toast('Escribe al menos una respuesta')}}
function bq(b){const d=BD[b];$('#main').innerHTML=MB+`<div class=eb style="color:#116">Insignia ${b} · ${d.ch}</div><h1>Quiz de insignia: ${d.n}</h1><span class=chip>Aprueba con 4 de 5 · +50 XP</span><div id=rw></div><div class=card><div id=host></div></div><div class=row id=nav></div>`;rwd();quiz($('#host'),QZ[b],.8,()=>fin('q'+b,50))}
function rwd(){const b=+V.n[1];if(!st.done['q'+b])return;$('#rw').innerHTML=`<div class=rw style="margin-top:18px">${im('insignia-'+b+'.png',BD[b].e)}<div class=eb>¡Insignia obtenida!</div><h2>${BD[b].n}</h2><p>${BD[b].ch}</p><button class=b onclick="nextNode()">Volver al mapa →</button></div>`}
function fp(){const T=['1. Mi horizonte y visión de futuro','2. Mis metas en cinco áreas','3. Mi ruta de acción','4. Mi plan de relaciones','5. Reflexión final'];
$('#main').innerHTML=MB+`<div class=eb style="color:#116">Proyecto integrador</div><h1>Arquitecto de Mi Vida</h1><div class=card><div class=who>${im('bicente-maestro.png','🦬','av2')}MENSAJE DE BICENTE</div><p>«¡Lo lograste, explorador! Ahora construye tu propio plan. No tiene que ser perfecto ni necesitas todas las respuestas hoy: explica qué quieres alcanzar, qué pasos puedes dar y cómo cuidarás tus relaciones.»</p><p class=muted>El cálculo de esperanza de vida es opcional. Nadie debe sentirse obligado a compartir información sensible.</p></div>
${T.map((t,i)=>`<details ${i?'':'open'}><summary>${t}</summary><div id=fh${i+1}></div></details>`).join('')}
<div class=card><h3>Rúbrica (100 puntos · aprobación sugerida: 80)</h3><table><tr><th>Criterio</th><th>Pts</th><th>Evidencia esperada</th></tr><tr><td>Horizonte y visión</td><td>15</td><td>Visión de futuro y dirección personal</td></tr><tr><td>Metas en cinco áreas</td><td>25</td><td>Metas de corto y largo plazo en las categorías</td></tr><tr><td>Ruta de acción</td><td>30</td><td>Meta, objetivos intermedios y actividades concretas</td></tr><tr><td>Relaciones significativas</td><td>20</td><td>Acciones y frecuencias para fortalecerlas</td></tr><tr><td>Reflexión final</td><td>10</td><td>Qué aprendió y cómo usará su plan</td></tr></table><p class=muted style="margin-top:10px">No se evalúa qué tan ambiciosas o convencionales sean las metas, sino la claridad y la relación lógica entre metas, objetivos y acciones.</p><div class=row><span></span><button class=b id=fz>Finalizar certificación · +100 XP</button></div></div><div id=cw></div>`;
['f1','f2','f3','f4','f5'].forEach((f,i)=>form($('#fh'+(i+1)),f,FM[f]));$('#fz').onclick=()=>{if(!['f1','f2','f3','f4','f5'].every(filled))return toast('Completa al menos una respuesta en cada entregable');fin('f',100);cert()};if(st.done.f)cert()}
const YT=[0,'aGdwYFsfCzg','Lq7nBNzRKAc','O7nCQ28lINc'],TEACHER='';
const A=(f,i)=>(st.ans[f+'.'+i]||'').trim();
function secs(){const sc=(f,g)=>FM[f].some((_,i)=>A(f,i))?f:g,L=f=>FM[f].map((q,i)=>[q,A(f,i)]).filter(x=>x[1]),f=sc('f2','s3');
return [{k:'v',t:'Mi horizonte y visión de futuro',e:'🧭',l:L('f1')},{k:'m',t:'Mis metas en cinco áreas',e:'🎯',tb:AR.map((a,i)=>[a[1]+' '+a[0],A(f,2*i),A(f,2*i+1)])},{k:'r',t:'Mi ruta de acción',e:'⛰️',l:L(sc('f3','s6'))},{k:'l',t:'Mi plan de relaciones',e:'🌳',l:L(sc('f4','s8'))},{k:'x',t:'Reflexión final',e:'✍️',l:L('f5')}].filter(s=>st.inc[s.k]!==0&&(s.l?s.l.length:s.tb.some(r=>r[1]||r[2])))}
function planHtml(){const S2=secs(),bg=[1,2,3].filter(b=>st.done['q'+b]);
return `<div class=pl2><div class=ph><span class=e>🦬</span><div><small>BIG HORN ACADEMY · PLAN DE VIDA CON BICENTE EL BISONTE</small><h1>Mi Plan de Vida</h1><p>${esc(st.name||'Participante')} · ${new Date().toLocaleDateString('es')}</p></div></div><div class=bgc>${bg.map(b=>`<span>${BD[b].e} ${BD[b].n}</span>`).join('')}${st.done.f?'<span>🏆 Arquitecto de Mi Vida</span>':''}</div>${S2.map((s,i)=>`<section><h3><i>${i+1}</i>${s.e} ${s.t}</h3>${s.tb?`<table><tr><th>Área</th><th>Corto plazo</th><th>Largo plazo</th></tr>${s.tb.map(r=>`<tr><td><b>${r[0]}</b></td><td>${esc(r[1])||'—'}</td><td>${esc(r[2])||'—'}</td></tr>`).join('')}</table>`:s.l.map(x=>`<div class=pi><b>${x[0]}</b><p>${esc(x[1]).replace(/\n/g,'<br>')}</p></div>`).join('')}</section>`).join('')||'<p class=muted>Aún no hay respuestas. Completa las actividades y aquí aparecerá tu plan.</p>'}<footer>«Tu plan puede crecer y adaptarse contigo. Revísalo periódicamente.» — Bicente el Bisonte</footer></div>`}
const planText=()=>['MI PLAN DE VIDA — '+(st.name||''),...secs().flatMap(s=>['','== '+s.t.toUpperCase()+' ==',...(s.tb?s.tb.map(r=>r[0]+'\n  Corto plazo: '+(r[1]||'—')+'\n  Largo plazo: '+(r[2]||'—')):s.l.map(x=>x[0]+'\n  '+x[1]))])].join('\n');
function dlDoc(){const c='body{font-family:Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px}.ph{background:#0e2033;color:#fff;padding:12px}h3{border-bottom:2px solid #e0a93b}';const u=URL.createObjectURL(new Blob(['<html><head><meta charset=utf-8><style>'+c+'</style></head><body>'+planHtml()+'</body></html>'],{type:'application/msword'})),a=document.createElement('a');a.href=u;a.download='Mi-Plan-de-Vida'+(st.name?'-'+st.name.replace(/\s+/g,'-'):'')+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const mail=()=>{location.href='mailto:'+TEACHER+'?subject='+encodeURIComponent('Mi Plan de Vida · '+(st.name||''))+'&body='+encodeURIComponent('Hola, adjunto mi Plan de Vida en PDF.\n\n'+(st.name||''))};
const dip=n=>`<div class=dp><span class=lw><img data-b="logo-bha" src="img/logo-bha.png" alt="" onload="this.nextElementSibling.style.display='none'" onerror="ie(this)"><span class=lgo>BHA<small>2023</small></span></span><h4>BIG HORN ACADEMY</h4><div class=sm>OTORGA EL PRESENTE</div><h2>DIPLOMA</h2><div class=sm>A:</div><div class=nm><span class=nmv>${esc(n)||'Escribe tu nombre'}</span></div><div class=sm style="font-size:1.7cqw;color:#1b2a4a">Por su satisfactoria participación y culminación del curso:</div><div class=cu>« PLAN DE VIDA »</div><div class=fi>Otorgado en reconocimiento a su compromiso con el desarrollo e integralidad personal.</div><div class=sg>Sergio Nieto</div><div class=ln></div><b style="font-size:1.3cqw">SERGIO NIETO</b><div class=fi>Director de Big Horn Academy</div><div class=fi style="margin-top:1cqw">${new Date().toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}</div></div>`;
function pr(k){$('#pr').innerHTML=k=='d'?`<div class=dw>${dip(st.name)}</div>`:planHtml();$('#pg').textContent=k=='d'?'@page{size:11in 8.5in;margin:0}':'@page{size:letter;margin:14mm}';document.title=(k=='d'?'Diploma-Plan-de-Vida-':'Mi-Plan-de-Vida-')+(st.name||'BHA').replace(/\s+/g,'-');setTimeout(()=>print(),200)}
function panel(){return `<div class=card><h2>📦 Entrega tu Plan de Vida</h2><p>Tu plan se arma con lo que escribiste en las actividades. Tú decides qué secciones incluir en lo que entregas.</p><div class=inc>${[['v','Visión'],['m','Metas'],['r','Ruta'],['l','Relaciones'],['x','Reflexión']].map(([k,t])=>`<label><input type=checkbox ${st.inc[k]===0?'':'checked'} onchange="st.inc['${k}']=this.checked?1:0;save();$('#pp').innerHTML=planHtml()">${t}</label>`).join('')}</div><div class=paper id=pp>${planHtml()}</div><div class=row><button class=b onclick="pr('p')">⬇️ Descargar PDF</button><button class="b ghost" onclick="dlDoc()">📝 Editable (Word)</button><button class="b ghost" onclick="copy(planText())">📋 Copiar texto</button><button class="b ghost" onclick="mail()">✉️ Enviar por correo</button></div><ol class=muted><li>Descarga el PDF (en el cuadro de impresión elige «Guardar como PDF»).</li><li>Súbelo a tu clase de Google Classroom o envíalo por correo con el botón de arriba y adjunta el archivo.</li><li>Guarda tu copia: tu plan puede cambiar contigo.</li></ol></div>`}
function planView(){$('#main').innerHTML=`<div class=eb style="color:#116">Tu documento</div><h1>Mi Plan de Vida</h1><p>Aquí se va armando tu plan con las respuestas de tus actividades.</p>`+panel()}
function cert(){$('#cw').innerHTML=`<div class=rw>${im('insignia-final.png','🏆')}<h2>¡Felicidades, Arquitecto de Mi Vida!</h2><p>Tu siguiente capítulo comienza ahora. Descarga tu diploma y entrega tu plan.</p></div><div class=card><h2>🎓 Tu diploma</h2><label class=fl>Escribe tu nombre completo, tal como aparecerá en el diploma<input id=dnm value="${esc(st.name)}" oninput="st.name=this.value;save();side();document.querySelectorAll('.nmv').forEach(e=>e.textContent=this.value||'Escribe tu nombre');$('#dd').disabled=!this.value.trim();$('#pp').innerHTML=planHtml()"></label><div class=dw>${dip(st.name)}</div><div class=row><span class=muted>Revisa la ortografía de tu nombre antes de descargar.</span><button class=b id=dd ${st.name.trim()?'':'disabled'} onclick="pr('d')">⬇️ Descargar diploma (PDF)</button></div></div>`+panel();$('#cw').scrollIntoView({behavior:'smooth'})}
render();
</script></body></html>
